name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      ARF_TEST_STRICT: '1'
      ARF_TEST_SNACKS: ${{ github.workspace }}/.test-deps/snacks.nvim
      R_PROFILE_USER: /dev/null
      R_ENVIRON_USER: /dev/null
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install pinned Neovim and arf releases
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) nvim_platform=linux-x86_64; arf_platform=x86_64-unknown-linux-gnu ;;
            Darwin-arm64) nvim_platform=macos-arm64; arf_platform=aarch64-apple-darwin ;;
            Darwin-x86_64) nvim_platform=macos-x86_64; arf_platform=x86_64-apple-darwin ;;
            *) echo 'Unsupported runner platform'; exit 1 ;;
          esac
          echo "NVIM_LOG_FILE=$RUNNER_TEMP/arf-nvim.log" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/arf-tools"
          cd "$RUNNER_TEMP/arf-tools"
          curl --fail --location --retry 3 -o nvim.tar.gz "https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-${nvim_platform}.tar.gz"
          tar -xzf nvim.tar.gz
          echo "$PWD/nvim-${nvim_platform}/bin" >> "$GITHUB_PATH"
          archive="arf-console-${arf_platform}.tar.xz"
          curl --fail --location --retry 3 -O "https://github.com/eitsupi/arf/releases/download/v0.6.0/$archive"
          curl --fail --location --retry 3 -O "https://github.com/eitsupi/arf/releases/download/v0.6.0/$archive.sha256"
          if command -v sha256sum >/dev/null; then
            sha256sum -c "$archive.sha256"
          else
            shasum -a 256 -c "$archive.sha256"
          fi
          tar -xJf "$archive"
          arf_binary="$(find "$PWD" -type f -name arf -print -quit)"
          test -n "$arf_binary"
          echo "$(dirname "$arf_binary")" >> "$GITHUB_PATH"
      - name: Install pinned R parser and Snacks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-deps
          git init .test-deps/tree-sitter-r
          git -C .test-deps/tree-sitter-r remote add origin https://github.com/r-lib/tree-sitter-r.git
          git -C .test-deps/tree-sitter-r fetch --depth 1 origin 58a22794466c0fc15b0d3b40531db751593721e8
          git -C .test-deps/tree-sitter-r checkout --detach FETCH_HEAD
          git init "$ARF_TEST_SNACKS"
          git -C "$ARF_TEST_SNACKS" remote add origin https://github.com/folke/snacks.nvim.git
          git -C "$ARF_TEST_SNACKS" fetch --depth 1 origin e6fd58c82f2f3fcddd3fe81703d47d6d48fc7b9f
          git -C "$ARF_TEST_SNACKS" checkout --detach FETCH_HEAD
          nvim --headless -u NONE -l tests/install_parser.lua
      - name: Run all suites (integration dependencies required)
        run: nvim --headless -u NONE -l tests/run.lua
