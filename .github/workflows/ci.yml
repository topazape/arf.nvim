name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ARF_TEST_MODE: unit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Neovim
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/nvim.tar.gz" https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "NVIM_LOG_FILE=$RUNNER_TEMP/arf-nvim.log" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: nvim --headless -u NONE -l tests/run.lua
